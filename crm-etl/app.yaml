runtime: python311

# App Engine Standard Environment configuration
env_variables:
  ENVIRONMENT: production
  PYTHONPATH: /srv

# Resources
instance_class: F4_1G
automatic_scaling:
  min_instances: 0
  max_instances: 10
  target_cpu_utilization: 0.6
  target_throughput_utilization: 0.6

# Health checks
readiness_check:
  path: /health
  check_interval_sec: 5
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2

liveness_check:
  path: /health
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2

# Files to include in deployment
includes:
  - backend/
  - extractors/
  - utils/
  - requirements-prod.txt
  - ferramenta_etl_ai_unificada.py
  - processador_dados_unificado.py

# Files to skip
skip_files:
  - ^(.*/)?#.*#$
  - ^(.*/)?.*~$
  - ^(.*/)?.*\.py[co]$
  - ^(.*/)?.*/RCS/.*$
  - ^(.*/)?\..*$
  - ^(.*/)?tests?/.*$
  - ^(.*/)?test_.*\.py$
  - ^(.*/)?.*_test\.py$
  - ^(.*/)?data/.*$
  - ^(.*/)?output/.*$
  - ^(.*/)?datachain-0\.27\.0/.*$
  - ^(.*/)?production_models/.*$
  - ^(.*/)?docs/.*$
  - ^(.*/)?README.*$
  - ^(.*/)?.*\.md$