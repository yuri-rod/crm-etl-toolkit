runtime: python39

handlers:
  - url: /
    static_files: static/index.html
    upload: static/index.html
    secure: always

  - url: /static
    static_dir: static
    secure: always

  - url: /(.*\.(css|js|png|jpg|jpeg|gif|ico|svg))$
    static_files: static/\1
    upload: static/.*\.(css|js|png|jpg|jpeg|gif|ico|svg)$
    secure: always

automatic_scaling:
  min_instances: 0
  max_instances: 10
